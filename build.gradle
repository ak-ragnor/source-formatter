plugins {
    id 'java'
    id 'application'
    id 'maven-publish'
    // Removed: id 'jacoco'
}

group = 'com.codeformatter'
version = '1.0.0-SNAPSHOT'
sourceCompatibility = '17'

application {
    mainClass = 'com.codeformatter.cli.FormatterCli'
}

repositories {
    mavenCentral()
}

dependencies {
    // Core dependencies
    implementation 'com.github.javaparser:javaparser-symbol-solver-core:3.25.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.14.2'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.14.2'

    // Spring dependencies
    implementation 'org.springframework:spring-core:6.0.6'

    // JavaScript engine
    implementation 'org.graalvm.js:js:22.3.1'
    implementation 'org.graalvm.js:js-scriptengine:22.3.1'

    // CLI
    implementation 'info.picocli:picocli:4.7.1'

    // Testing dependencies
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.9.2'
    testImplementation 'org.junit.platform:junit-platform-suite:1.9.2'
    testImplementation 'org.mockito:mockito-core:5.2.0'
}

// Removed: jacoco configuration block

test {
    useJUnitPlatform()

    // Memory settings
    maxHeapSize = "1g"

    // Test output configuration
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = true
    }

    // Parallel execution
    maxParallelForks = Runtime.runtime.availableProcessors().intdiv(2) ?: 1

    // Removed: jacoco block
}

// Removed: unitTest task with jacoco configuration
task unitTest(type: Test) {
    useJUnitPlatform {
        includeTags 'unit'
        excludeTags 'integration', 'slow'
    }
}

// Removed: integrationTest task with jacoco configuration
task integrationTest(type: Test) {
    useJUnitPlatform {
        includeTags 'integration'
    }
}

// Removed: jacocoTestReport task

// Removed: jacocoTestCoverageVerification task

// Replace with a simple test coverage task without jacoco
task testCoverage(type: Test) {
    group 'Verification'
    description 'Runs tests without coverage enforcement'
}

// Removed: check.dependsOn jacocoTestCoverageVerification

jar {
    manifest {
        attributes 'Main-Class': 'com.codeformatter.cli.FormatterCli'
    }

    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register('createDistributable', Zip) {
    from jar
    from('src/main/resources/scripts') {
        into 'bin'
        fileMode = 0755
    }
    from('src/main/resources/config') {
        into 'config'
    }
    from 'README.md'
    from 'LICENSE'

    archiveFileName = "advanced-formatter-${version}.zip"
    destinationDirectory = file("$buildDir/distributions")
}

build.dependsOn createDistributable