plugins {
    id 'java'
    id 'application'
    id 'maven-publish'
    id 'jacoco'
}

group = 'com.codeformatter'
version = '1.0.0-SNAPSHOT'
sourceCompatibility = '17'

application {
    mainClass = 'com.codeformatter.cli.FormatterCli'
}

repositories {
    mavenCentral()
}

dependencies {

    implementation 'com.github.javaparser:javaparser-symbol-solver-core:3.25.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.14.2'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.14.2'


    implementation 'org.springframework:spring-core:6.0.6'


    implementation 'org.graalvm.js:js:22.3.1'
    implementation 'org.graalvm.js:js-scriptengine:22.3.1'


    implementation 'info.picocli:picocli:4.7.1'


    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.9.2'
    testImplementation 'org.junit.platform:junit-platform-suite:1.9.2'
    testImplementation 'org.mockito:mockito-core:5.2.0'
}


jacoco {
    toolVersion = "0.8.8"
}


test {
    useJUnitPlatform()


    maxHeapSize = "1g"


    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = true
    }


    maxParallelForks = Runtime.runtime.availableProcessors().intdiv(2) ?: 1


    jacoco {
        enabled = false

    }
}


task unitTest(type: Test) {
    useJUnitPlatform {
        includeTags 'unit'
        excludeTags 'integration', 'slow'
    }

    jacoco {
        destinationFile = file("${buildDir}/jacoco/unitTest.exec")
    }
}


task integrationTest(type: Test) {
    useJUnitPlatform {
        includeTags 'integration'
    }

    jacoco {
        destinationFile = file("${buildDir}/jacoco/integrationTest.exec")
    }
}


jacocoTestReport {
    dependsOn test

    reports {
        xml.required = true
        csv.required = false
        html.required = true
        html.destination file("${buildDir}/reports/jacoco")
    }

    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [

                    "com/codeformatter/cli/FormatterCli.class",
                    "**/config/*Config.class",
                    "**/*Exception.class"
            ])
        }))
    }
}


jacocoTestCoverageVerification {
    dependsOn jacocoTestReport

    violationRules {
        rule {
            limit {
                minimum = 0.70
            }
        }

        rule {
            element = 'CLASS'
            includes = ['com.codeformatter.core.*', 'com.codeformatter.plugins.*']

            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }

            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.70
            }
        }
    }
}


task testCoverage(type: Test) {
    group 'Verification'
    description 'Runs tests and generates coverage report without enforcing minimum coverage'

    finalizedBy jacocoTestReport
}


check.dependsOn jacocoTestCoverageVerification


jar {
    manifest {
        attributes 'Main-Class': 'com.codeformatter.cli.FormatterCli'
    }

    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}


tasks.register('createDistributable', Zip) {
    from jar
    from('src/main/resources/scripts') {
        into 'bin'
        fileMode = 0755
    }
    from('src/main/resources/config') {
        into 'config'
    }
    from 'README.md'
    from 'LICENSE'

    archiveFileName = "advanced-formatter-${version}.zip"
    destinationDirectory = file("$buildDir/distributions")
}

build.dependsOn createDistributable