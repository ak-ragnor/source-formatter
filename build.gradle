plugins {
    id 'java'
    id 'application'
    id 'maven-publish'
    id 'com.diffplug.spotless' version '6.20.0'
    id 'com.github.node-gradle.node' version '3.5.1'
}

group = 'com.codeformatter'
version = '1.0.0-SNAPSHOT'
sourceCompatibility = '17'

application {
    mainClass = 'com.codeformatter.cli.FormatterCli'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.github.javaparser:javaparser-symbol-solver-core:3.25.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.14.2'
    implementation 'com.github.javaparser:javaparser-core:3.25.4'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.14.2'

    implementation 'org.springframework:spring-core:6.0.6'

    implementation 'info.picocli:picocli:4.7.1'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.9.2'
    testImplementation 'org.junit.platform:junit-platform-suite:1.9.2'
    testImplementation 'org.mockito:mockito-core:5.2.0'
}

// Node.js configuration
node {
    version = '16.14.0'
    download = true
    workDir = file("${project.buildDir}/nodejs")
    npmWorkDir = file("${project.buildDir}/npm")
    nodeProjectDir = file("${project.projectDir}")
}

task installJsTools(type: NpmTask) {
    args = ['install']
}

task processJsResources(type: Copy) {
    from "${project.projectDir}/node"
    into "${project.buildDir}/resources/main/node"
}

processResources.dependsOn processJsResources
processResources.dependsOn installJsTools

test {
    useJUnitPlatform()

    maxHeapSize = "1g"

    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = true
    }

    maxParallelForks = Runtime.runtime.availableProcessors().intdiv(2)?: 1
}

tasks.register('unitTest', Test) {
    useJUnitPlatform {
        includeTags 'unit'
        excludeTags 'integration', 'slow'
    }
}

tasks.register('integrationTest', Test) {
    useJUnitPlatform {
        includeTags 'integration'
    }
}

tasks.register('testCoverage', Test) {
    group 'Verification'
    description 'Runs tests without coverage enforcement'
}

jar {
    manifest {
        attributes 'Main-Class': 'com.codeformatter.cli.FormatterCli'
    }

    from {
        configurations.runtimeClasspath.collect { it.isDirectory()? it : zipTree(it) }
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register('createDistributable', Zip) {
    from jar
    from('src/main/resources/scripts') {
        into 'bin'
        fileMode = 0755
    }
    from('src/main/resources/config') {
        into 'config'
    }
    from 'README.md'
    from 'LICENSE'

    archiveFileName = "advanced-formatter-${version}.zip"
    destinationDirectory = file("$buildDir/distributions")
}

build.dependsOn createDistributable

spotless {
    java {
        target fileTree('.') {
            include '**/*.java'
            exclude '**/build/**', '**/build-*/**', '**/bin/**'
        }
        importOrder()
        toggleOffOn()
        cleanthat()
        googleJavaFormat()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }

    format 'javascript', {
        target fileTree('.') {
            include '**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx'
            exclude '**/node_modules/**', '**/build/**', '**/dist/**', '**/target/**'
        }

        prettier().config([
            'printWidth': 80,
            'tabWidth': 2,
            'useTabs': false,
            'semi': true,
            'singleQuote': true,
            'trailingComma': 'es5',
            'bracketSpacing': true,
            'jsxBracketSameLine': false,
            'arrowParens': 'avoid'
        ])

        endWithNewline()
        trimTrailingWhitespace()
    }

    groovyGradle {
        target '**/*.gradle'
        greclipse()
        indentWithSpaces(4)
        trimTrailingWhitespace()
        endWithNewline()
    }

    json {
        target fileTree('.') {
            include '**/*.json'
            exclude '**/node_modules/**', '**/build/**'
        }
        prettier()
    }
}
